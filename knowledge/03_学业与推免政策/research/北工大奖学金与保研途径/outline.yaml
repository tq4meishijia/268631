topic: 北京工业大学奖学金项目与保研途径深度调研
created: 2026-11-10
status: outline_pending_confirmation
scope_note: 以校级现行制度为主，标注届别适用性；第三方数据一律标注非官方
execution:
  batch_size: 4
  items_per_agent: 3
  output_dir: ./results
  time_range: 2024年至今（含更早仍现行有效的文件）
  search_strategy: 官方站点优先 + 国内多引擎交叉检索 + 第三方仅作线索

items:
  # A. 奖学金项目（本科）
  - id: A01
    name: 国家级奖助（国家奖学金 / 国家励志奖学金 / 国家助学金）
    why: 金额最高、覆盖最广；金额标准近年有调整，需核实 2026 招生简章口径
    key_questions: [金额, 参评年级, 家庭经济困难认定, 能否兼得]
  - id: A02
    name: 校级个人奖（本科生学习优秀奖 / 优秀学生干部 / 励志奖 / 科技创新奖 / 三好学生）
    why: 工大发〔2026〕7号 第四条列明，与综测、竞赛成果直接挂钩
    key_questions: [评定标准, 名额比例, 学院细化细则, 体测门槛]
  - id: A03
    name: 校级高额与荣誉类奖项（校长奖学金 / 科技之星 / 创新创业奖 / 优秀退役大学生 / 优秀毕业生）
    why: 金额与荣誉最高（优秀退役大学生 2 万元），且各有独立实施办法
    key_questions: [独立评定办法, 覆盖本研, 成果不得重复申报规则]
  - id: A04
    name: 集体奖与院级奖学金
    why: 工大发〔2026〕7号 第二十四条允许学院自设院级奖学金，化生学院/樊恭烋学院有独立细则
    key_questions: [先进班集体/宿舍, 院级细则差异]
  - id: A05
    name: 专项奖学金（创新创业奖学金2026版 / 公派出国境学习奖学金 / 高水平双创竞赛激励办法）
    why: 招生简章主表未列，属易漏项；工大发〔2026〕11号明确含推免加分支持
    key_questions: [文件文号, 奖励范围, 与推免加分的关联]
  - id: A06
    name: 社会捐赠奖学金
    why: 项目多、专业/学院绑定强，需逐一核对适用对象
    known_list: [北燃实业奖励金, 比亚迪奖学金, 材料卓越学子奖学金, 樊恭烋奖学金, 高志奖学金, 光工学子奖, 汉通奖学金, 宏丰奖学金, 环境材料优秀学子奖学金, 李农奖学金, 任福田交通奖学金, 万集奖学金, 小米奖学金, 中国家电院教育奖学金及刘挺奖学金, 祝维沙创新创业奖学金]
    key_questions: [金额区间, 适用学院与专业, 年级限制, 生医工是否可申请]
  - id: A07
    name: 资助项目（与奖学金的边界）
    why: 常被混为一谈，但不属奖学金；需明确区分以免误导
    known_list: [国家助学贷款, 物价补贴, 国家助学金, 饮水洗澡电话补助, 临时困难补助, 校友捐赠助学金, 光彩学子助学金, 小米助学金, 绿色通道, 勤工助学, 学费缓减免]
  - id: A08
    name: 研究生奖助（工大发〔2026〕8号）
    why: 保研后的直接经济收益；推免新生一等学业奖学金与推免路径强相关
    key_questions: [国家奖学金, 学业奖学金档位, 推免新生待遇, 国家助学金]

  # B. 保研途径
  - id: B01
    name: 推荐端制度依据与届别适用性
    why: 工大发〔2025〕25号 + 工大发〔2025〕24号 + 2025版竞赛认定目录；旧文档引用更早版本
    key_questions: [文号, 生效年级, 与2023版目录差异, 2026级适用版本推测]
  - id: B02
    name: 综合积分 / 智育积分构成与加分上限
    why: 旧文档为科技创新4分+志愿1.5分；第三方称奖励加分上限5分、加权成绩占比不低于85%，存在冲突
    key_questions: [加权平均分口径, 首考制, 只认一项/取高值, 上限, 志愿与入伍加分]
  - id: B03
    name: 普通类推免（学保）
    why: 主通道，按学院名额与综合积分排序
    key_questions: [名额分配, 排名门槛, 公示与候补递补, 承诺书不得放弃]
  - id: B04
    name: 专项推免通道
    why: 2027届通知明确"取消学术专长专项"，改设研究生支教团专项、工程硕博士专项，与旧文档"科技类推免"冲突
    known_list: [研究生支教团专项, 工程硕博士专项, 学术专长专项（已取消待核）, 学生工作类（待核）, 特长类（待核）]
    key_questions: [组织单位, 排名门槛前50%, 是否可兼报, 直博生附加要求]
  - id: B05
    name: 直博 / 本硕博贯通 / 硕博连读
    why: 工大发〔2026〕26号修订了本科直博与硕博连读办法
    key_questions: [选拔条件, 学制5年与学费, 两位教授推荐书, 分流退出机制]
  - id: B06
    name: 接收端流程（2027年接收推免办法）
    why: 研招网 2026-09-06 发布，预报名9月6—20日、正式报名9月21日9:00—10月20日
    key_questions: [报名条件, 复试形式与60分及格线, 待录取确认, 资格作废条款]
  - id: B07
    name: 本校深造 vs 外校申请
    why: 校外夏令营/预推免/九推与校内推荐资格是两套流程，需拆清
    key_questions: [夏令营时间线, 外校硬通货, 教育部推免服务系统唯一确认]
  - id: B08
    name: 推免规模与学院差异
    why: 2026届全校769人/3280人≈23.45%，化生学院29/109≈26.60%（第三方人工统计）
    key_questions: [官方公示数据, 近五年趋势, 生医工专业名额]
  - id: B09
    name: 时间线与硬截止
    why: 加分材料截止推免当年8月31日；网报9月7日17:00关闭；公示9月10—17日
    key_questions: [各节点负责单位, 大一至大四行动窗口]
  - id: B10
    name: 奖学金与保研的联动关系
    why: 本次调研的核心交叉点——奖学金是否计入推免加分、是否进综测、是否仅作复试材料
    key_questions: [国奖是否加分, 校级奖是否加分, 综测与推免积分是否两套账, 高额竞赛激励办法的推免加分条款]

  # C. 交叉核验
  - id: C01
    name: 口径冲突清单与待核实项
    why: 奖学金金额 8000/5000 vs 10000/6000；加分上限 4 vs 5；科技类推免存废；前20% vs 前30% vs 前50%
    key_questions: [逐条给出来源层级, 可核验链接, 建议向哪个部门核实]
